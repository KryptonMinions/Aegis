name: Deploy Frontend to Web Client Hosting

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

# Serialize deploys so the commit-back push (build-and-deploy) can't race a second run.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

  build-and-deploy:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Bump client-package.json version
        run: bash scripts/bump-client-version.sh frontend/public/client-package.json

      # CRITICAL: .env.local must NOT exist during production build.
      # .env.local (localhost API URL) overrides .env.production and breaks
      # the deployed app. The CI runner has no .env.local (clean checkout),
      # so this is inherently safe here — but verify explicitly.
      - name: Verify no .env.local override
        working-directory: frontend
        run: |
          if [ -f .env.local ]; then
            echo "ERROR: .env.local exists in repo — it must be gitignored" >&2
            exit 1
          fi

      - name: Build static export
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Verify basePath applied
        working-directory: frontend
        run: |
          if ! grep -q '/app/_next' out/index.html; then
            echo "ERROR: basePath /app not applied — asset refs missing /app/ prefix" >&2
            exit 1
          fi

      - name: Verify nested routes exported
        working-directory: frontend
        run: |
          for route in ask dashboard; do
            if [ ! -f "out/${route}/index.html" ]; then
              echo "ERROR: out/${route}/index.html missing — trailingSlash: true not working" >&2
              exit 1
            fi
          done

      - name: Install Catalyst CLI
        run: npm install -g zcatalyst-cli

      - name: Deploy to Web Client Hosting
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
        run: catalyst deploy --only client --project-id "${{ secrets.CATALYST_PROJECT_ID }}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/client-package.json
          git diff --cached --quiet || git commit -m "chore: bump client-package.json [skip ci]"
          git push
