name: Deploy Frontend to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

  build-and-deploy:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # .env.local (localhost API URL) overrides the build-time env and would
      # break the deployed app; it must stay gitignored.
      - name: Verify no .env.local override
        working-directory: frontend
        run: |
          if [ -f .env.local ]; then
            echo "ERROR: .env.local exists in repo — it must be gitignored" >&2
            exit 1
          fi

      - name: Build static export
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

      - name: Verify nested routes exported
        working-directory: frontend
        run: |
          for route in ask dashboard; do
            if [ ! -f "out/${route}/index.html" ]; then
              echo "ERROR: out/${route}/index.html missing — trailingSlash: true not working" >&2
              exit 1
            fi
          done

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      # firebase-tools picks up the application-default credentials written
      # by the auth step above.
      - name: Deploy to Firebase Hosting
        working-directory: frontend
        run: npx --yes firebase-tools@13 deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}"
